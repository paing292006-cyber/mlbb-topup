<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB TopUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>MLBB Diamond TopUp</h1>
  <p>Fast • Safe • Cheap</p>
</header>

<div class="container">

  <h2>Player Information</h2>

  <input type="text" placeholder="Enter User ID">
  <input type="text" placeholder="Enter Zone ID">

  <h2>Select Diamond</h2>

  <div class="packages">
    <button>86 Diamonds</button>
    <button>172 Diamonds</button>
    <button>257 Diamonds</button>
    <button>Weekly Pass</button>
  </div>

  <h2>Payment</h2>

  <select>
    <option>KBZPay</option>
    <option>WavePay</option>
    <option>AYA Pay</option>
  </select>

  <button class="buy">Buy Now</button>

</div>

<script src="script.js"></script>

</body>
</html>
